name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Test & Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run Clippy (all targets, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Advisory SRP line budget report (> 350 lines)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          count=0
          while IFS= read -r -d '' file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 350 ]; then
              echo "::warning file=$file::$file has $lines lines (soft budget 350)"
              count=$((count + 1))
            fi
          done < <(find crates -type f -name '*.rs' -print0)
          echo "Advisory SRP scan finished ($count file(s) above 350 lines)."

  release:
    name: Release (${{ matrix.target }})
    needs: [check]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: anvil.exe
            archive: zip
          - target: aarch64-apple-darwin
            os: macos-latest
            bin: anvil
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: anvil
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release -p anvil-cli --target ${{ matrix.target }}

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $dir = "dist"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $bin = "target/${{ matrix.target }}/release/${{ matrix.bin }}"
          $zip = "$dir/anvil-$tag-${{ matrix.target }}.zip"
          Compress-Archive -Path $bin -DestinationPath $zip -Force
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  anvil-$tag-${{ matrix.target }}.zip" | Out-File -FilePath "$zip.sha256" -Encoding ascii

      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist
          bin_dir="target/${{ matrix.target }}/release"
          archive="dist/anvil-${tag}-${{ matrix.target }}.tar.gz"
          tar -C "$bin_dir" -czf "$archive" "${{ matrix.bin }}"
          (cd dist && sha256sum "anvil-${tag}-${{ matrix.target }}.tar.gz" > "anvil-${tag}-${{ matrix.target }}.tar.gz.sha256")

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
